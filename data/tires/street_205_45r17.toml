[pressure]
cold_pressure_pa = { value = 331000.0, source = "2.3 bar gauge set cold", confidence = "placeholder" }
cold_temp_c = { value = 20.0, source = "temperature at which the cold pressure is set", confidence = "placeholder" }
ppx1 = { value = -0.3, source = "slip stiffness falls with pressure", confidence = "placeholder" }
ppx3 = { value = -0.1, source = "friction falls slightly with pressure", confidence = "placeholder" }
ppx4 = { value = 0.0, source = "not modelled yet", confidence = "placeholder" }
