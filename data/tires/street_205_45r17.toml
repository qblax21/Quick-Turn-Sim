qdz2 = { value = -0.01, source = "small load dependence", confidence = "placeholder" }
qez1 = { value = -1.5, source = "textbook-typical pneumatic trail shape", confidence = "placeholder" }

[transient]
carcass_stiffness_long_n_per_m = { value = 480000.0, source = "gives a longitudinal relaxation length near 0.17 m at nominal load", confidence = "placeholder" }
carcass_stiffness_lat_n_per_m = { value = 150000.0, source = "gives a lateral relaxation length near 0.4 m at nominal load", confidence = "placeholder" }
