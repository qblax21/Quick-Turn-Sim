convection_surface_w_per_k = { value = 8.0, source = "order of magnitude", confidence = "placeholder" }
convection_surface_speed_gain = { value = 2.0, source = "order of magnitude", confidence = "placeholder" }
convection_carcass_w_per_k = { value = 6.0, source = "order of magnitude", confidence = "placeholder" }
convection_carcass_speed_gain = { value = 0.6, source = "order of magnitude", confidence = "placeholder" }
friction_heat_fraction = { value = 0.6, source = "share of sliding heat entering the tire rather than the road", confidence = "placeholder" }
