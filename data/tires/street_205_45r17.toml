carcass_heat_capacity_j_per_k = { value = 9000.0, source = "carcass and sidewalls, order of magnitude", confidence = "placeholder" }
gas_heat_capacity_j_per_k = { value = 100.0, source = "about 0.14 kg of air at constant volume", confidence = "estimated" }
conductance_surface_core_w_per_k = { value = 120.0, source = "order of magnitude", confidence = "placeholder" }
