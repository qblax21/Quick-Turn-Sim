# Harrow Drift Park: a FICTIONAL track laid out for drifting (D-113).
#
# Original layout, placeholder quality, not a copy of any real venue.
# Distances in metres, angles in degrees; negative arcs turn right, so the
# lap runs clockwise. A 14 m road with paved run-off at every corner,
# linked corners, sweepers and a hairpin, with painted clipping points:
# an inner clipping point (ICP) at each apex and an outer clipping zone
# (OCZ) along the outside of each corner, as drift judging uses them.
#
#   distance  element
#         0   straight, 200 m
#       200   T1: right, 90 degrees, radius 60 m
#       294   T2: left, 115 degrees, radius 42 m
#       379   T3: right, 140 degrees, radius 38 m
#       471   straight, 45 m
#       516   T4: left, 175 degrees, radius 16 m
#       565   straight, 85 m
#       650   T5: right, 95 degrees, radius 34 m
#       707   T6: left, 75 degrees, radius 28 m
#       743   T7: right, 165 degrees, radius 24 m
#       812   straight, 120 m
#       932   T8: right, 55 degrees, radius 40 m
#       971   straight, 479 m
#      1449   T9: right, 180 degrees, radius 133 m
#      1867   straight, 40 m

id = "harrow_drift_park"
name = "Harrow Drift Park"
description = "Fictional 1.91 km drift course: linked sweepers, a tight hairpin, a linked right-left-right and a long back straight into a 180 degree carousel, with paved run-off and painted clipping points."
default_surface = "dirt"
air_temp_c = 20.0
road_temp_c = 28.0
ground_half_extent_m = 700.0

[spawn]
x = 0.0
y = 0.0
heading_deg = 0.0

[[paths]]
id = "circuit"
start_x = 0.0
start_y = 0.0
start_heading_deg = 0.0
segments = [
    { kind = "straight", length_m = 200.000 },
    { kind = "arc", radius_m = 60.000, angle_deg = -90.0 },  # T1
    { kind = "arc", radius_m = 42.000, angle_deg = 115.0 },  # T2
    { kind = "arc", radius_m = 38.000, angle_deg = -140.0 },  # T3
    { kind = "straight", length_m = 45.000 },
    { kind = "arc", radius_m = 16.000, angle_deg = 175.0 },  # T4
    { kind = "straight", length_m = 85.000 },
    { kind = "arc", radius_m = 34.000, angle_deg = -95.0 },  # T5
    { kind = "arc", radius_m = 28.000, angle_deg = 75.0 },  # T6
