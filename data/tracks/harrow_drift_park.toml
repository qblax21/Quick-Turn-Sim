    { kind = "straight", length_m = 120.000 },
    { kind = "arc", radius_m = 40.000, angle_deg = -55.0 },  # T8
    { kind = "straight", length_m = 478.585 },
    { kind = "arc", radius_m = 132.833, angle_deg = -180.0 },  # T9
    { kind = "straight", length_m = 40.000 },
]

