    { kind = "arc", radius_m = 90.0, angle_deg = -50.0 },
    { kind = "arc", radius_m = 90.0, angle_deg = 100.0 },
    { kind = "arc", radius_m = 90.0, angle_deg = -50.0 },
    { kind = "arc", radius_m = 50.0, angle_deg = 90.0 },
    { kind = "straight", length_m = 120.0 },
    { kind = "arc", radius_m = 35.0, angle_deg = -180.0 },
    { kind = "straight", length_m = 120.0 },
    { kind = "arc", radius_m = 50.0, angle_deg = 90.0 },
    { kind = "straight", length_m = 90.0 },
    { kind = "arc", radius_m = 50.0, angle_deg = 90.0 },
    { kind = "straight", length_m = 70.0 },
    { kind = "arc", radius_m = 45.0, angle_deg = -60.0 },
    { kind = "arc", radius_m = 45.0, angle_deg = 120.0 },
    { kind = "arc", radius_m = 45.0, angle_deg = -60.0 },
    # The last two straights are sized so the lap closes on the start point.
    { kind = "straight", length_m = 44.115 },
    { kind = "arc", radius_m = 70.0, angle_deg = 90.0 },
    { kind = "straight", length_m = 22.571 },
]

