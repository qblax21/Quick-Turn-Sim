# Ridgeline Circuit: a FICTIONAL closed road circuit with elevation.
#
# Original layout, placeholder quality. It is not a copy of any real circuit
# and no dimension here was taken from one. Distances in metres, angles in
# degrees; positive arc angles turn left, so the lap runs counter-clockwise.
#
#   distance  element
#       0     start/finish straight (472 m in all), level
#     450     T1: right, radius 90 m, slightly downhill
#     544     T2: long banked left, 150 degrees, radius 110 m, at the low point
#     832     climb: 320 m straight at about 7 percent
#    1152     T3: left, radius 60 m, still rising
#    1427     T4-T6: fast right-left-right esses along the ridge, radius 90 m
#    1741     T7: left, radius 50 m, into the infield descent
#    1939     T8: banked right hairpin, radius 35 m, at the bottom of a dip
#    2049     climb back up to the ridge
#    2169     T9: left, radius 50 m
#    2338     T10: left over the crest, radius 50 m, the highest point
#    2486     T11-T13: the drop, right-left-right, radius 45 m, falling 21 m
#             in 190 m (about 11 percent)
#    2719     T14: banked left, radius 70 m, back onto the straight

id = "ridgeline_circuit"
name = "Ridgeline Circuit"
description = "Fictional 2.85 km circuit with 38 m of elevation: banked carousel, climb, ridge esses, hairpin in a dip, blind crest and a steep drop."
default_surface = "dirt"
air_temp_c = 20.0
road_temp_c = 28.0
ground_half_extent_m = 900.0

[spawn]
x = 0.0
y = 0.0
heading_deg = 0.0

[[paths]]
id = "circuit"
start_x = 0.0
start_y = 0.0
start_heading_deg = 0.0
segments = [
    { kind = "straight", length_m = 450.0 },
    { kind = "arc", radius_m = 90.0, angle_deg = -60.0 },
    { kind = "arc", radius_m = 110.0, angle_deg = 150.0 },
