duct_cooling_gain = { value = 1.0, source = "as the front", confidence = "placeholder" }
duct_opening = { value = 0.0, source = "no brake ducts as delivered", confidence = "estimated" }

[aero]
air_density_kg_per_m3 = { value = 1.2, source = "sea level, 20 degrees C", confidence = "estimated" }
drag_area_m2 = { value = 0.67, source = "class-typical Cd 0.32 times frontal area 2.1 m2", confidence = "placeholder" }
lift_area_front_m2 = { value = 0.12, source = "small front lift, typical unassisted hatch", confidence = "placeholder" }
lift_area_rear_m2 = { value = 0.18, source = "small rear lift, typical unassisted hatch", confidence = "placeholder" }

[drivetrain]
kind = "engine_manual"
driven_axle = "front"

[drivetrain.engine]
torque_curve_rpm = { value = [1000.0, 1500.0, 4400.0, 4700.0, 6200.0, 7000.0], source = "the comparable engine's published shape: 350 N.m from 1500 to 4400 rpm, 169 kW from 4700 to 6200 rpm (Volkswagen press presentation, GTI Performance, docs/VALIDATION_SOURCES.md); the ends below 1500 and above 6200 rpm are guesses", confidence = "estimated" }
torque_curve_nm = { value = [200.0, 350.0, 350.0, 343.0, 260.0, 200.0], source = "as torque_curve_rpm: 343 and 260 N.m are 169 kW at 4700 and 6200 rpm", confidence = "estimated" }
