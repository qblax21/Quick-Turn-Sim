# Tern GT: a FICTIONAL small three-door front-wheel-drive turbocharged hatch.
#
# The name and design are original. Where a value is "estimated" it is taken
# from the published figures of the real comparable car (a 2011 small
# three-door turbocharged hatch, named only in docs/VALIDATION_SOURCES.md);
# the rest are placeholders typical of the class. Every value carries its
# source and a confidence level (placeholder / estimated / measured).
# Nothing is measured on this car.

id = "hatch_tern_gt"
name = "Tern GT"
class = "Small three-door front-wheel-drive turbocharged hatch (fictional)"
description = "Car A. Front transverse 1.6 litre turbo, six-speed manual, open differential."
tire_front = "summer_195_55r16"
tire_rear = "summer_195_55r16"

[body]
sprung_mass_kg = { value = 1133.0, source = "the comparable car measured at 2623 lb (1190 kg) by Edmunds (2007 long-term test, same body and engine family, docs/VALIDATION_SOURCES.md), plus a 75 kg driver, less 132 kg unsprung; makers quote 1205 to 1215 kg at the kerb", confidence = "estimated" }
inertia_roll_kg_m2 = { value = 367.0, source = "rule-of-thumb radius of gyration for a small hatch: the earlier figure scaled by sprung mass and width squared", confidence = "placeholder" }
inertia_pitch_kg_m2 = { value = 1397.0, source = "rule-of-thumb radius of gyration for a small hatch: the earlier figure scaled by sprung mass and length squared", confidence = "placeholder" }
inertia_yaw_kg_m2 = { value = 1561.0, source = "rule-of-thumb radius of gyration for a small hatch: the earlier figure scaled by sprung mass and length squared", confidence = "placeholder" }
wheelbase_m = { value = 2.467, source = "the comparable car's published wheelbase, 2467 mm (BMW Group press data, January 2010; Carfolio; docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
cg_to_front_axle_m = { value = 0.9375, source = "chosen to give 62 percent of total weight on the front axle, typical of a front-drive small hatch with a transverse engine; no published distribution found", confidence = "placeholder" }
cg_height_m = { value = 0.53, source = "class-typical centre-of-gravity height for a small hatch, a little below the earlier 0.56 m for a lower, lighter car", confidence = "placeholder" }
length_m = { value = 3.729, source = "the comparable car's overall length after its 2010 update, 3729 mm (Carfolio, docs/VALIDATION_SOURCES.md; 3714 mm before)", confidence = "estimated" }
front_overhang_m = { value = 0.691, source = "the comparable car's front overhang, 691 mm (rear 565 mm), from BMW Group press technical data for the 2011 MINI hatch, seen as a search-result excerpt and not read first-hand (docs/VALIDATION_SOURCES.md); the two add up to its 3723 mm length less the 2467 mm wheelbase, so the rear overhang here is the remainder, 571 mm", confidence = "estimated" }
width_m = { value = 1.683, source = "the comparable car's overall width without mirrors, 1683 mm (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
height_m = { value = 1.258, source = "the comparable car's overall height, 1407 mm, less its 149 mm ground clearance (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
ground_clearance_m = { value = 0.149, source = "the comparable car's published ground clearance, 149 mm (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
contact_stiffness_n_per_m = { value = 250000.0, source = "numerical penalty stiffness for body-to-ground contact", confidence = "placeholder" }
contact_damping_n_s_per_m = { value = 9000.0, source = "numerical penalty damping for body-to-ground contact", confidence = "placeholder" }
contact_friction = { value = 0.5, source = "guess for bodywork sliding on tarmac", confidence = "placeholder" }

[suspension.front]
track_m = { value = 1.453, source = "the comparable car's front track, 1453 mm (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
unsprung_mass_kg = { value = 36.0, source = "class-typical driven-corner unsprung mass with a 16 inch wheel", confidence = "placeholder" }
wheel_inertia_kg_m2 = { value = 1.0, source = "16 inch wheel, tire, disc and hub, order of magnitude", confidence = "placeholder" }
spring_rate_n_per_m = { value = 32100.0, source = "the earlier rate scaled by the lighter corner mass, keeping the same ride frequency (about 1.5 Hz)", confidence = "placeholder" }
motion_ratio = { value = 0.95, source = "typical strut motion ratio", confidence = "placeholder" }
damper_bump_n_s_per_m = { value = 2360.0, source = "the earlier value scaled by corner mass: about 0.35 of critical in bump", confidence = "placeholder" }
damper_rebound_n_s_per_m = { value = 4090.0, source = "the earlier value scaled by corner mass: about 0.6 of critical in rebound", confidence = "placeholder" }
anti_roll_bar_n_per_m = { value = 10550.0, source = "the earlier 12500 (softened after a drive found the car a little understeery) scaled by sprung mass", confidence = "placeholder" }
bump_travel_m = { value = 0.075, source = "class-typical bump travel", confidence = "placeholder" }
droop_travel_m = { value = 0.085, source = "class-typical droop travel", confidence = "placeholder" }
bump_stop_rate_n_per_m = { value = 160000.0, source = "stiff progressive stop approximated as linear", confidence = "placeholder" }
static_camber_rad = { value = -0.0175, source = "about -1.0 degree, typical sporty road alignment", confidence = "placeholder" }
camber_gain_rad_per_m = { value = -0.35, source = "about -2 degrees per 100 mm of bump for a strut", confidence = "placeholder" }
static_toe_rad = { value = 0.0, source = "zero front toe", confidence = "placeholder" }
roll_center_height_m = { value = 0.06, source = "typical lowered-strut roll centre height", confidence = "placeholder" }
anti_pitch_tan = { value = 0.08, source = "mild anti-dive", confidence = "placeholder" }

[suspension.rear]
track_m = { value = 1.461, source = "the comparable car's rear track, 1461 mm (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
unsprung_mass_kg = { value = 30.0, source = "class-typical undriven-corner unsprung mass with a 16 inch wheel", confidence = "placeholder" }
wheel_inertia_kg_m2 = { value = 0.9, source = "16 inch wheel, tire, disc and hub, order of magnitude", confidence = "placeholder" }
spring_rate_n_per_m = { value = 25300.0, source = "the earlier rate scaled by the lighter corner mass, keeping the same ride frequency (about 1.7 Hz)", confidence = "placeholder" }
motion_ratio = { value = 0.93, source = "typical torsion-beam or multi-link ratio", confidence = "placeholder" }
damper_bump_n_s_per_m = { value = 1660.0, source = "the earlier value scaled by corner mass: about 0.35 of critical in bump", confidence = "placeholder" }
damper_rebound_n_s_per_m = { value = 2830.0, source = "the earlier value scaled by corner mass: about 0.6 of critical in rebound", confidence = "placeholder" }
anti_roll_bar_n_per_m = { value = 16900.0, source = "the earlier 20000 (raised after a first drive found too little lift-off oversteer) scaled by sprung mass", confidence = "placeholder" }
bump_travel_m = { value = 0.08, source = "class-typical bump travel", confidence = "placeholder" }
droop_travel_m = { value = 0.09, source = "class-typical droop travel", confidence = "placeholder" }
bump_stop_rate_n_per_m = { value = 140000.0, source = "stiff progressive stop approximated as linear", confidence = "placeholder" }
static_camber_rad = { value = -0.026, source = "about -1.5 degrees", confidence = "placeholder" }
camber_gain_rad_per_m = { value = -0.5, source = "about -3 degrees per 100 mm of bump", confidence = "placeholder" }
static_toe_rad = { value = 0.001, source = "slight rear toe-in; halved after a first drive found too little lift-off oversteer", confidence = "placeholder" }
roll_center_height_m = { value = 0.14, source = "typical rear roll centre height for the layout", confidence = "placeholder" }
anti_pitch_tan = { value = 0.10, source = "mild anti-lift", confidence = "placeholder" }

[steering]
ratio = { value = 13.40, source = "derived as in D-083: 432 degrees over a mean road-wheel lock of 32.25 degrees, the lock at which the car, turning about the rear axle line at its mean front angle, traces the comparable car's published 10.7 m turning circle (BMW Group press data, January 2010, docs/VALIDATION_SOURCES.md) with this car's wheelbase, track, Ackermann share and 195 mm tire; a constant average", confidence = "estimated" }
max_wheel_angle_rad = { value = 7.540, source = "2.4 turns lock to lock (432 degrees each way), the comparable car's published figure (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
ackermann_fraction = { value = 0.6, source = "partial Ackermann, typical road car", confidence = "placeholder" }
caster_rad = { value = 0.105, source = "about 6 degrees", confidence = "placeholder" }
kingpin_inclination_rad = { value = 0.21, source = "about 12 degrees, typical strut", confidence = "placeholder" }
scrub_radius_m = { value = 0.005, source = "small positive scrub radius", confidence = "placeholder" }
mechanical_trail_m = { value = 0.024, source = "raised from 0.022 after a drive asked for slightly more steering weight; originally: follows from caster and wheel radius, rounded", confidence = "placeholder" }
compliance_rad_per_nm = { value = 0.00005, source = "chosen to add roughly 1.5 degrees per g of compliance understeer, a typical road-car order of magnitude", confidence = "placeholder" }
assist_speed_kmh = { value = [0.0, 20.0, 50.0, 100.0, 160.0], source = "speeds of the assist table", confidence = "placeholder" }
assist_gain = { value = [6.0, 4.0, 2.0, 1.2, 0.9], source = "electric power steering boost falling with speed, chosen to give about 5 N.m at the rim when parking and 3 to 4 N.m in a 0.5 g corner at 100 km/h, typical of published EPAS figures for the class; the earlier unassisted rack was judged about right in weight at a reduced FFB gain, which this does not contradict: the gain sets the scale", confidence = "placeholder" }
assist_threshold_nm = { value = 0.8, source = "on-centre torque below which the assist does nothing, typical EPAS tuning; not measured", confidence = "placeholder" }
rack_friction_nm = { value = 0.8, source = "order of the steering-system friction felt at the rim of an EPAS car; not measured", confidence = "placeholder" }
steering_inertia_kg_m2 = { value = 0.006, source = "two 16 inch road-wheel assemblies at about 0.75 kg.m2 each about their kingpins, divided by the steering ratio squared, plus the rack", confidence = "estimated" }
torsion_bar_nm_per_rad = { value = 115.0, source = "about 2 N.m per degree, the middle of the 1.5 to 2.5 N.m per degree electric power steering torsion bars are usually made at; not measured", confidence = "placeholder" }
assist_side_inertia_kg_m2 = { value = 0.05, source = "assist motor through its reduction, rack and road wheels, referred to the column; order of magnitude, not measured. With the torsion bar it sets a twist frequency near 7 Hz, the range in which electric steering filters kerb and road shocks (D-088)", confidence = "placeholder" }
torsion_damping_ratio = { value = 0.7, source = "assist motor and rack damping as a share of critical; chosen for a well-damped column, not measured", confidence = "placeholder" }

[brakes]
max_torque_front_nm = { value = 2600.0, source = "enough to exceed front grip at full pedal with the lighter car and 294 mm front discs", confidence = "placeholder" }
max_torque_rear_nm = { value = 700.0, source = "about 21 percent rear bias", confidence = "placeholder" }
handbrake_torque_nm = { value = 1200.0, source = "enough to lock the rear wheels", confidence = "placeholder" }

fade_temp_c = { value = [0.0, 100.0, 350.0, 500.0, 650.0, 800.0], source = "shape of a road brake pad's friction against temperature: slightly low cold, flat through its working range, fading above about 450 degC; not measured for any pad", confidence = "placeholder" }
fade_friction_factor = { value = [0.92, 1.0, 1.0, 0.85, 0.6, 0.45], source = "as fade_temp_c", confidence = "placeholder" }

[brakes.abs]
enabled = true
slip_threshold = { value = 0.10, source = "target braking slip, just below the peak of the placeholder tire", confidence = "placeholder" }
release_rate_per_s = { value = 14.0, source = "controller tuning guess", confidence = "placeholder" }
apply_rate_per_s = { value = 7.0, source = "controller tuning guess", confidence = "placeholder" }
min_speed_m_per_s = { value = 2.0, source = "typical cut-out speed", confidence = "placeholder" }
control_gain_per_s = { value = 80.0, source = "controller tuning guess", confidence = "placeholder" }

[brakes.thermal_front]
heat_capacity_j_per_k = { value = 3400.0, source = "vented 294 mm cast-iron disc (the comparable car's size, Carfolio, docs/VALIDATION_SOURCES.md) of about 6.8 kg at 460 J/(kg.K), plus some of the hub and caliper", confidence = "estimated" }
disc_heat_share = { value = 0.9, source = "most of the friction work goes into the disc, which has far more heat capacity and contact with air than the pads", confidence = "placeholder" }
convection_w_per_k = { value = 6.0, source = "natural convection of a disc this size, order of magnitude", confidence = "placeholder" }
convection_speed_gain = { value = 0.8, source = "chosen for a cooling time constant of about two minutes at 30 m/s, the order quoted for road-car discs; not measured", confidence = "placeholder" }
radiation_area_m2 = { value = 0.062, source = "emissivity about 0.6 of cast iron in use times both faces of a 294 mm disc", confidence = "estimated" }
duct_cooling_gain = { value = 1.0, source = "a fully open duct taken to double the speed-dependent cooling; not measured", confidence = "placeholder" }
duct_opening = { value = 0.0, source = "no brake ducts as delivered", confidence = "estimated" }

[brakes.thermal_rear]
heat_capacity_j_per_k = { value = 1900.0, source = "solid 259 mm disc (the comparable car's size, Carfolio, docs/VALIDATION_SOURCES.md) of about 3.9 kg at 460 J/(kg.K), plus some of the hub", confidence = "estimated" }
disc_heat_share = { value = 0.9, source = "as the front", confidence = "placeholder" }
convection_w_per_k = { value = 4.0, source = "natural convection of a disc this size, order of magnitude", confidence = "placeholder" }
convection_speed_gain = { value = 0.5, source = "scaled from the front by disc size; not measured", confidence = "placeholder" }
radiation_area_m2 = { value = 0.045, source = "emissivity about 0.6 times both faces of a 259 mm disc", confidence = "estimated" }
duct_cooling_gain = { value = 1.0, source = "as the front", confidence = "placeholder" }
duct_opening = { value = 0.0, source = "no brake ducts as delivered", confidence = "estimated" }

[aero]
air_density_kg_per_m3 = { value = 1.2, source = "sea level, 20 degrees C", confidence = "estimated" }
drag_area_m2 = { value = 0.72, source = "the comparable car's published Cd 0.36 times frontal area 1.99 m2 (Carfolio, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
lift_area_front_m2 = { value = 0.12, source = "small front lift, typical unassisted hatch", confidence = "placeholder" }
lift_area_rear_m2 = { value = 0.18, source = "small rear lift, typical unassisted hatch", confidence = "placeholder" }

[drivetrain]
kind = "engine_manual"
driven_axle = "front"

[drivetrain.engine]
torque_curve_rpm = { value = [1000.0, 1700.0, 4500.0, 5500.0, 6500.0, 7000.0], source = "the comparable engine's published shape: 260 N.m with overboost (240 N.m sustained, 1600 to 5000 rpm) from 1700 to 4500 rpm, 135 kW at 5500 rpm (Carfolio, Edmunds, docs/VALIDATION_SOURCES.md); overboost is used because it is what full throttle gives, for short bursts; the ends below 1700 and above 5500 rpm are guesses", confidence = "estimated" }
torque_curve_nm = { value = [150.0, 260.0, 260.0, 234.0, 185.0, 140.0], source = "as torque_curve_rpm: 234 N.m is 135 kW at 5500 rpm", confidence = "estimated" }
inertia_kg_m2 = { value = 0.13, source = "1.6 litre engine plus flywheel, order of magnitude", confidence = "placeholder" }
idle_rpm = { value = 850.0, source = "typical idle speed", confidence = "placeholder" }
redline_rpm = { value = 6500.0, source = "typical rev limit for a small turbocharged 1.6; not found published", confidence = "placeholder" }
friction_torque_nm = { value = 14.0, source = "order of magnitude", confidence = "placeholder" }
friction_nm_per_rad_s = { value = 0.025, source = "order of magnitude", confidence = "placeholder" }
overrev_damage_rpm = { value = 7200.0, source = "about 700 rpm past the limiter, where valve-to-piston clearance is commonly said to run out on production engines; no measurement", confidence = "placeholder" }
overrev_failure_rpm = { value = 8700.0, source = "guess at where a production valvetrain fails outright; no measurement", confidence = "placeholder" }

[drivetrain.clutch]
max_torque_nm = { value = 390.0, source = "1.5 times peak engine torque", confidence = "placeholder" }
auto_engage_start_rpm = { value = 1100.0, source = "assist tuning guess", confidence = "placeholder" }
auto_engage_full_rpm = { value = 2200.0, source = "assist tuning guess", confidence = "placeholder" }
free_travel = { value = 0.08, source = "pedal play of about 10 mm in roughly 140 mm of travel, typical of a hydraulic clutch; not measured", confidence = "placeholder" }
bite_point = { value = 0.45, source = "middle of the bite zone a little above mid-travel, typical of a road car; not measured", confidence = "placeholder" }
bite_width = { value = 0.25, source = "bite zone about 35 mm of pedal; not measured", confidence = "placeholder" }

[drivetrain.gearbox]
ratios = { value = [3.308, 2.130, 1.483, 1.139, 0.949, 0.816], source = "the comparable car's six-speed manual (BMW Group press data, January 2010 and March 2012, docs/VALIDATION_SOURCES.md)", confidence = "estimated" }
reverse_ratio = { value = 3.231, source = "as ratios", confidence = "estimated" }
final_drive = { value = 3.706, source = "as ratios", confidence = "estimated" }
shift_time_s = { value = 0.25, source = "quick manual shift", confidence = "placeholder" }

[drivetrain.differential]
# Open, as the comparable car as standard; a limited-slip differential was
# an option on it (Edmunds' 2007 long-term car had one,
# docs/VALIDATION_SOURCES.md). The clutch-pack values below apply when one
# is fitted (the _lsd variant or the garage).
kind = "open"
preload_nm = { value = 50.0, source = "clutch-pack options only (D-084): spring preload in the usual range of aftermarket clutch-type units, 30 to 100 N.m; not measured", confidence = "placeholder" }
power_ramp_deg = { value = 45.0, source = "clutch-pack options only: a middle drive-side ramp of the 30 to 60 degree range clutch-type units are sold with; not measured", confidence = "placeholder" }
coast_ramp_deg = { value = 60.0, source = "clutch-pack options only: a gentler overrun ramp, the common 1.5-way arrangement; not measured", confidence = "placeholder" }
friction_faces = { value = 8.0, source = "clutch-pack options only: four friction faces each side, order of magnitude", confidence = "placeholder" }
plate_friction = { value = 0.12, source = "clutch-pack options only: oil-wetted steel-on-sintered plates, order of magnitude", confidence = "placeholder" }
clutch_to_ramp_radius = { value = 1.0, source = "clutch-pack options only: packs and ramps at about the same radius, order of magnitude", confidence = "placeholder" }

[traction_control]
enabled = true
slip_threshold = { value = 0.12, source = "target drive slip, near the peak of the placeholder tire", confidence = "placeholder" }
release_rate_per_s = { value = 14.0, source = "controller tuning guess", confidence = "placeholder" }
apply_rate_per_s = { value = 4.0, source = "controller tuning guess", confidence = "placeholder" }
control_gain_per_s = { value = 100.0, source = "controller tuning guess", confidence = "placeholder" }
min_speed_m_per_s = { value = 2.0, source = "reference speed floor so a launch is not read as infinite slip", confidence = "placeholder" }
