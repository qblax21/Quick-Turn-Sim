# SPDX-License-Identifier: CC-BY-4.0
# Kestrel RC: a FICTIONAL front-engined rear-drive two-rotor turbo coupe,
# built as a modified drift car (D-111).
#
# The name and design are original. Its base is the published data of a
# real comparable car, a late-1980s two-seat rotary turbo coupe, named only
# in docs/VALIDATION_SOURCES.md. The build on top of that (power, coilovers,
# angle kit, locked differential) is estimated from what such builds use;
# every such value says so and is marked unverified there. Every value
# carries its source and a confidence level (placeholder / estimated /
# measured). Nothing is measured on this car.

id = "coupe_kestrel_rc"
name = "Kestrel RC"
class = "Front-engined rear-drive rotary turbo coupe, drift build (fictional)"
description = "Car C. Front-mid two-rotor turbo, five-speed manual, locked differential, angle kit, coilovers."
tire_front = "summer_205_55r16"
tire_rear = "summer_205_55r16"

[body]
sprung_mass_kg = { value = 1165.0, source = "the comparable car's claimed kerb weight, 1250 kg (Carfolio, read first-hand), plus a 75 kg driver, less 160 kg unsprung; the build is taken to add and remove about as much as it", confidence = "estimated" }
inertia_roll_kg_m2 = { value = 380.0, source = "rule-of-thumb radius of gyration: the Tern GT's figure scaled by sprung mass and width squared", confidence = "placeholder" }
inertia_pitch_kg_m2 = { value = 1901.0, source = "rule-of-thumb radius of gyration: the Tern GT's figure scaled by sprung mass and length squared", confidence = "placeholder" }
inertia_yaw_kg_m2 = { value = 2124.0, source = "rule-of-thumb radius of gyration: the Tern GT's figure scaled by sprung mass and length squared", confidence = "placeholder" }
wheelbase_m = { value = 2.430, source = "the comparable car's wheelbase, 2430 mm (Carfolio, read first-hand)", confidence = "estimated" }
cg_to_front_axle_m = { value = 1.2029, source = "50.5 percent of the weight on the front axle, quoted from the maker's launch figures in search results only (not verified); the car is widely described as about 50:50", confidence = "estimated" }
cg_height_m = { value = 0.46, source = "a low two-seat coupe, lowered 30 mm on coilovers; no published figure found", confidence = "placeholder" }
length_m = { value = 4.290, source = "the comparable car's length, 4290 mm (Carfolio, read first-hand)", confidence = "estimated" }
width_m = { value = 1.690, source = "the comparable car's width, 1690 mm (Carfolio, read first-hand)", confidence = "estimated" }
height_m = { value = 1.145, source = "the comparable car's height, 1265 mm (Carfolio, read first-hand), less 30 mm of lowering and the 0.12 m ground clearance", confidence = "estimated" }
ground_clearance_m = { value = 0.12, source = "about 150 mm standard (not found published) less 30 mm of lowering", confidence = "placeholder" }
contact_stiffness_n_per_m = { value = 250000.0, source = "numerical penalty stiffness for body-to-ground contact", confidence = "placeholder" }
contact_damping_n_s_per_m = { value = 9000.0, source = "numerical penalty damping", confidence = "placeholder" }
contact_friction = { value = 0.5, source = "guess for bodywork sliding on tarmac", confidence = "placeholder" }

[suspension.front]
track_m = { value = 1.450, source = "the comparable car's front track, 1450 mm (Carfolio, read first-hand); the angle kit is taken not to change it", confidence = "estimated" }
unsprung_mass_kg = { value = 40.0, source = "16 inch wheel and tire, vented disc and four-piston caliper, strut and angle-kit knuckle; class-typical", confidence = "placeholder" }
wheel_inertia_kg_m2 = { value = 1.1, source = "16 inch alloy wheel, 205/55 tire and disc", confidence = "placeholder" }
spring_rate_n_per_m = { value = 78500.0, source = "8 kgf/mm coilover spring, a common front rate on street and drift coilovers for this chassis (not verified); ride frequency 2.5 Hz", confidence = "estimated" }
motion_ratio = { value = 0.95, source = "front strut with the spring on the strut", confidence = "placeholder" }
damper_bump_n_s_per_m = { value = 3540.0, source = "0.35 of critical damping in bump at the wheel with the spring above", confidence = "placeholder" }
damper_rebound_n_s_per_m = { value = 6070.0, source = "0.6 of critical damping in rebound at the wheel", confidence = "placeholder" }
anti_roll_bar_n_per_m = { value = 25000.0, source = "stiffened front bar for a drift car; no figure found", confidence = "placeholder" }
bump_travel_m = { value = 0.05, source = "reduced by 30 mm of lowering", confidence = "placeholder" }
droop_travel_m = { value = 0.07, source = "class-typical", confidence = "placeholder" }
bump_stop_rate_n_per_m = { value = 200000.0, source = "stiff bump stops on a lowered car", confidence = "placeholder" }
static_camber_rad = { value = -0.061, source = "-3.5 degrees, a typical front drift alignment (not verified)", confidence = "estimated" }
camber_gain_rad_per_m = { value = -0.3, source = "strut front", confidence = "placeholder" }
static_toe_rad = { value = 0.0, source = "zero front toe", confidence = "placeholder" }
roll_center_height_m = { value = 0.03, source = "strut roll centre dropped by lowering; the angle kit's correction is not modelled", confidence = "placeholder" }
anti_pitch_tan = { value = 0.05, source = "class-typical", confidence = "placeholder" }

[suspension.rear]
track_m = { value = 1.440, source = "the comparable car's rear track, 1440 mm (Carfolio, read first-hand)", confidence = "estimated" }
unsprung_mass_kg = { value = 40.0, source = "independent rear with 16 inch wheel, disc and upright", confidence = "placeholder" }
wheel_inertia_kg_m2 = { value = 1.1, source = "16 inch alloy wheel, 205/55 tire and disc", confidence = "placeholder" }
spring_rate_n_per_m = { value = 58800.0, source = "6 kgf/mm coilover spring, a common rear rate on street and drift coilovers for this chassis (not verified); ride frequency 1.9 Hz", confidence = "estimated" }
motion_ratio = { value = 0.85, source = "multi-link rear, damper inboard of the wheel", confidence = "placeholder" }
damper_bump_n_s_per_m = { value = 3390.0, source = "0.35 of critical damping in bump at the wheel", confidence = "placeholder" }
damper_rebound_n_s_per_m = { value = 5810.0, source = "0.6 of critical damping in rebound at the wheel", confidence = "placeholder" }
anti_roll_bar_n_per_m = { value = 12000.0, source = "rear bar kept soft so the rear can be stepped out; no figure found", confidence = "placeholder" }
bump_travel_m = { value = 0.055, source = "reduced by lowering", confidence = "placeholder" }
droop_travel_m = { value = 0.07, source = "class-typical", confidence = "placeholder" }
bump_stop_rate_n_per_m = { value = 200000.0, source = "stiff bump stops on a lowered car", confidence = "placeholder" }
static_camber_rad = { value = -0.009, source = "-0.5 degrees, little rear camber for drive grip in a slide (not verified)", confidence = "estimated" }
camber_gain_rad_per_m = { value = -0.5, source = "multi-link rear", confidence = "placeholder" }
static_toe_rad = { value = 0.002, source = "slight toe-in for stability", confidence = "placeholder" }
roll_center_height_m = { value = 0.10, source = "multi-link rear, lowered", confidence = "placeholder" }
anti_pitch_tan = { value = 0.10, source = "class-typical", confidence = "placeholder" }

[steering]
ratio = { value = 8.70, source = "angle kit: 60 degrees of road-wheel lock on the rack's 522 degrees of steering-wheel travel each way (2.9 turns lock to lock, the later model's figure; the comparable car's own was not found, not verified); kits reach the extra lock with shorter steering arms, so the overall ratio quickens", confidence = "estimated" }
max_wheel_angle_rad = { value = 9.111, source = "522 degrees each way, 2.9 turns lock to lock (not verified for this car)", confidence = "estimated" }
ackermann_fraction = { value = 0.2, source = "angle kits make Ackermann adjustable (FDF Mantis and FAT kits for the comparable car, seen in search results); drift setups run little of it; 0.2 is not verified", confidence = "estimated" }
caster_rad = { value = 0.1222, source = "7 degrees: angle kits add caster for self-centring at large angles; the value is not verified", confidence = "estimated" }
kingpin_inclination_rad = { value = 0.21, source = "class-typical strut", confidence = "placeholder" }
scrub_radius_m = { value = 0.01, source = "class-typical", confidence = "placeholder" }
mechanical_trail_m = { value = 0.038, source = "tan(7 degrees) times the 0.316 m tire radius, from the caster", confidence = "estimated" }
compliance_rad_per_nm = { value = 0.00005, source = "as the Tern GT", confidence = "placeholder" }
assist_speed_kmh = { value = [0.0, 20.0, 50.0, 100.0, 160.0], source = "power-assisted rack and pinion (Carfolio); speeds as the Tern GT", confidence = "placeholder" }
assist_gain = { value = [5.0, 3.5, 2.0, 1.3, 1.0], source = "hydraulic assist, a little lighter at low speed than the Tern GT's", confidence = "placeholder" }
assist_threshold_nm = { value = 0.8, source = "as the Tern GT", confidence = "placeholder" }
rack_friction_nm = { value = 1.0, source = "older hydraulic rack with angle-kit joints", confidence = "placeholder" }
steering_inertia_kg_m2 = { value = 0.008, source = "rack, longer travel and heavier wheels than the Tern GT", confidence = "placeholder" }
torsion_bar_nm_per_rad = { value = 115.0, source = "as the Tern GT", confidence = "placeholder" }
assist_side_inertia_kg_m2 = { value = 0.06, source = "as the Tern GT, scaled up a little", confidence = "placeholder" }
torsion_damping_ratio = { value = 0.7, source = "as the Tern GT", confidence = "placeholder" }

[brakes]
max_torque_front_nm = { value = 2400.0, source = "vented front discs with four-piston calipers (Carfolio lists vented discs all round; four-piston fronts on the Turbo II from search results, not verified); torque enough to lock the fronts", confidence = "placeholder" }
max_torque_rear_nm = { value = 1300.0, source = "vented rear discs; about 35 percent rear for a 50:50 car", confidence = "placeholder" }
handbrake_torque_nm = { value = 2200.0, source = "hydraulic handbrake, as drift builds fit, enough to lock the rears at speed", confidence = "placeholder" }
fade_temp_c = { value = [0.0, 100.0, 350.0, 500.0, 650.0, 800.0], source = "as the Tern GT: a road pad's friction against temperature", confidence = "placeholder" }
