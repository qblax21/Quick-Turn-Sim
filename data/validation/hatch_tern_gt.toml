# SPDX-License-Identifier: CC-BY-4.0
# Validation targets for the Tern GT (fictional small three-door FWD
# turbocharged hatch).
#
# The Tern GT is fictional. These targets are published figures of a REAL
# comparable car, the one its data is based on (D-093): the 2011 MINI
# Cooper S three-door hatch (R56 after its 2010 update), 1.6 litre turbo,
# 135 kW, 240 N.m (260 N.m with overboost), six-speed manual, front-wheel
# drive. No instrumented road test of the 2011 car itself was found online;
# the figures below come from Edmunds tests of R56 Cooper S cars and from
# the maker, as each source says. Sources and differences from the Tern GT
# are listed in docs/VALIDATION_SOURCES.md. The real name appears only here
# and there, never in the game.
#
# confidence = "estimated": each value is a figure for the comparable car,
# used as an estimate of what the Tern GT should do. None is a measurement
# of the Tern GT. The understeer target has no published source and stays a
# placeholder.

car = "hatch_tern_gt"
track = "test_track"
# Tires start at their grip optimum (30 C since D-109; 60 C before, the
# optimum when the harness was written).
tire_temp_c = 30.0
note = "Targets are published figures of a comparable real car (see docs/VALIDATION_SOURCES.md), not measurements of this car."

[[target]]
metric = "skidpad_lateral_g"
value = 0.87
unit = "g"
tolerance_percent = 10.0
source = "Edmunds track test, 2009 MINI Cooper S Convertible (R57, the convertible of the same generation and drivetrain) against a BMW 128i Convertible: skid pad 0.87 g. No figure for the R56 hatch was found; the hatch is lighter and stiffer, so this is a conservative estimate"
confidence = "estimated"

[[target]]
metric = "braking_distance_60_0"
value = 34.59
unit = "m"
tolerance_percent = 10.0
source = "Edmunds, 2011 MINI Cooper review: 'various Mini Cooper S models with 17-inch wheels stopped from 60 mph between 112 and 115 feet'; the middle, 113.5 ft. The Tern GT runs the standard 16-inch size"
confidence = "estimated"

[[target]]
metric = "accel_0_60"
value = 6.6
unit = "s"
tolerance_percent = 10.0
source = "MINI's estimate for the 2011 Cooper S manual, 0-60 mph in 6.6 s, quoted by Edmunds' 2011 MINI Cooper review (a maker's figure, no rollout). Cross-check: Edmunds measured 6.5 s for a 2007 Cooper S manual (172 hp) in its long-term test"
confidence = "estimated"

[[target]]
metric = "top_speed"
value = 63.33
unit = "m/s"
tolerance_percent = 6.0
source = "Maker's top speed for the 135 kW Cooper S manual, 228 km/h, as listed by Carfolio (2010 MINI Cooper S R56)"
confidence = "estimated"

[[target]]
metric = "understeer_gradient"
value = 2.5
unit = "deg/g"
tolerance_percent = 40.0
source = "no published understeer gradient found for the comparable car; rough expectation for a nose-heavy front-drive road car, a guess"
confidence = "placeholder"
