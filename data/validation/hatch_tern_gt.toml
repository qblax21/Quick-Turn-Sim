# SPDX-License-Identifier: CC-BY-4.0
# Validation targets for the Tern GT (fictional compact FWD hot hatch).
#
# The Tern GT is fictional. These targets are published road-test figures
# of a REAL comparable car, chosen as the closest match in layout, power,
# torque, mass and gearbox: the seventh-generation Volkswagen Golf GTI with
# the six-speed manual and the Performance Pack (169 kW / 230 PS in Europe,
# 220 hp in the US, 350 N.m, front-wheel drive, limited-slip front
# differential). Sources and differences from the Tern GT are listed in
# docs/VALIDATION_SOURCES.md. The real name appears only here and there,
# never in the game or the car data.
#
# confidence = "estimated": each value is a measurement of the comparable
# car, used as an estimate of what the Tern GT should do. None is a
# measurement of the Tern GT. The understeer target has no published
# source and stays a placeholder.

car = "hatch_tern_gt"
track = "test_track"
tire_temp_c = 60.0
note = "Targets are published road-test figures of a comparable real car (see docs/VALIDATION_SOURCES.md), not measurements of this car."

[[target]]
metric = "skidpad_lateral_g"
value = 0.94
unit = "g"
tolerance_percent = 10.0
source = "Car and Driver, 2017 Volkswagen Golf GTI Sport manual (Performance Pack), test by Joseph Capparella, 30 March 2017: roadholding, 300-ft-dia skidpad, 0.94 g (a 2015 GTI manual with the same pack: 0.93 g)"
confidence = "estimated"

[[target]]
metric = "braking_distance_70_0"
value = 46.94
unit = "m"
tolerance_percent = 10.0
source = "Car and Driver, 2017 Volkswagen Golf GTI Sport manual, 30 March 2017: braking, 70-0 mph, 154 ft (2015 GTI manual new: 156 ft)"
confidence = "estimated"

[[target]]
metric = "accel_0_60_rollout"
value = 5.9
unit = "s"
tolerance_percent = 10.0
source = "Car and Driver, 2017 Volkswagen Golf GTI Sport manual, 30 March 2017: zero to 60 mph, 5.9 s (2015 GTI manual new: 6.1 s). Car and Driver times with a one-foot rollout subtracted, per its published test method (not restated on the page); the harness measures this metric the same way"
confidence = "estimated"

[[target]]
metric = "top_speed"
value = 69.44
unit = "m/s"
tolerance_percent = 6.0
source = "Volkswagen press presentation of the Golf GTI, 22 April 2013: GTI Performance (230 PS) top speed 250 km/h, a manufacturer figure (220 PS GTI: 246 km/h). US cars are governed at 125 to 126 mph, which says nothing about drag and power"
confidence = "estimated"

[[target]]
metric = "understeer_gradient"
value = 2.5
unit = "deg/g"
tolerance_percent = 40.0
source = "no published understeer gradient or steering data found for the comparable car; rough expectation for a nose-heavy front-drive road car, a guess"
confidence = "placeholder"
