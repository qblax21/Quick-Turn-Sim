# SPDX-License-Identifier: CC-BY-4.0
# Validation targets for the Halden E4 (fictional dual-motor electric sedan).
#
# EVERY TARGET HERE IS A PLACEHOLDER. They are round, approximate figures
# typical of the class as widely published for such cars, not measurements
# of any vehicle. Replace them with measured values (see
# docs/TELEMETRY_IMPORT.md) and set confidence = "measured".
#
# tolerance_percent is the largest acceptable error. The harness reports the
# error for every target and fails beyond the tolerance.

car = "sedan_halden_e4"
track = "test_track"
tire_temp_c = 60.0
note = "Placeholder class-typical targets. Not measured."

[[target]]
metric = "skidpad_lateral_g"
value = 0.95
unit = "g"
tolerance_percent = 10.0
source = "approximate class-typical skidpad figure for a performance sedan on summer road tires"
confidence = "placeholder"

[[target]]
metric = "braking_distance_60_0"
value = 33.5
unit = "m"
tolerance_percent = 10.0
source = "approximate class-typical 60-0 mph stopping distance (about 110 ft)"
confidence = "placeholder"

[[target]]
metric = "accel_0_60"
value = 2.95
unit = "s"
tolerance_percent = 10.0
source = "driver expectation for the fastest cars of this class: just under 3 s without rollout; not a measurement"
confidence = "placeholder"

[[target]]
metric = "top_speed"
value = 72.2
unit = "m/s"
tolerance_percent = 6.0
source = "approximate class-typical top speed of about 260 km/h"
confidence = "placeholder"

[[target]]
metric = "understeer_gradient"
value = 2.0
unit = "deg/g"
tolerance_percent = 40.0
source = "rough expectation for a near-evenly balanced road sedan; wide tolerance because the figure itself is a guess"
confidence = "placeholder"
