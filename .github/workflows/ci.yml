# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      # Release mode: the suite integrates several hours of simulated time.
      - name: Test
        run: cargo test --workspace --release

      # Always print the validation numbers, pass or fail, so every run of
      # CI shows the current errors against the target files.
      - name: Validation report
        if: always()
        run: cargo run --release -p qts-validate

  # The demo slice must stay within its download budget (D-115). Exports the
  # demo game pack with the Godot editor (no export templates needed) and
  # checks the parts this project ships against tools/demo_budget.txt.
  # The slimmed Godot release template (D-121), rebuilt only when its
  # profile or build script changes.
  godot-template:
    name: godot template
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Restore the template
        id: cache
        uses: actions/cache@v4
        with:
          path: out/godot-template
          key: godot-template-4.7.2-${{ hashFiles('tools/godot_template/custom.py', 'tools/build_template.ps1') }}

      - name: Build the template
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install scons
          ./tools/build_template.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: godot-template
          path: out/godot-template/godot_template_release.exe

  demo-size:
    name: demo size budget
    needs: godot-template
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: godot-template
          path: out/godot-template

      - name: Install the stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Install Godot
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\godot.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\godot"

      - name: Package the demo and check its size
        shell: pwsh
        run: |
          $godot = (Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter "*_console.exe" | Select-Object -First 1).FullName
          & $godot --headless --path godot --import
          ./tools/package.ps1 -Demo -CheckBudget -Godot $godot -Template out/godot-template/godot_template_release.exe

      - name: Run the packaged demo
        shell: pwsh
        run: |
          # Headless: the runner has no GPU. This checks that the slimmed
          # runtime loads the pack, the simulation library and the scripts,
          # and drives the self-test session.
          $exe = Get-ChildItem out -Recurse -Filter "*Demo.exe" | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "--headless", "--self-test" -Wait -PassThru -RedirectStandardOutput out/selftest.txt -RedirectStandardError out/selftest_err.txt
          Get-Content out/selftest.txt, out/selftest_err.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
