# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
qts-core = { path = "crates/qts-core" }
qts-tire = { path = "crates/qts-tire" }
qts-vehicle = { path = "crates/qts-vehicle" }
qts-ffb = { path = "crates/qts-ffb" }
qts-telemetry = { path = "crates/qts-telemetry" }
qts-sim = { path = "crates/qts-sim" }
serde = { version = "1", features = ["derive"] }
toml = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"
# Index loops are clearer than iterator chains for small matrix code.
needless_range_loop = "allow"
too_many_arguments = "allow"

# Physics tests integrate hundreds of thousands of ticks; unoptimised float
# code makes them needlessly slow, so dev builds get basic optimisation.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
